<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 금융 상담 챗봇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #212121;
      color: #ececec;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ════════════════════════════════
       로그인 오버레이
    ════════════════════════════════ */
    #login-overlay {
      position: fixed; inset: 0;
      background: #171717;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #login-overlay.hidden { display: none; }

    #login-box {
      background: #212121;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 40px 44px;
      width: 400px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    #login-box .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #login-box .login-logo {
      font-size: 40px;
      line-height: 1;
    }
    #login-box h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ececec;
    }
    #login-box p {
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .login-field label {
      font-size: 13px;
      color: #aaa;
      font-weight: 500;
    }
    .login-field input {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 10px 14px;
      color: #ececec;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: #10a37f; }
    .login-field input::placeholder { color: #555; }

    #login-btn {
      background: #10a37f;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #login-btn:hover { background: #0e9070; }

    #login-error {
      font-size: 13px;
      color: #f87171;
      text-align: center;
      min-height: 18px;
    }

    .login-divider {
      border: none;
      border-top: 1px solid #2a2a2a;
    }

    /* ════════════════════════════════
       앱 레이아웃 (로그인 후 표시)
    ════════════════════════════════ */
    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }
    #app.hidden { display: none; }

    /* ── 사이드바 ── */
    #sidebar {
      width: 260px;
      background: #171717;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    #sidebar-top {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #ececec;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
      text-align: left;
    }
    #new-chat-btn:hover { background: #2a2a2a; }
    #new-chat-btn svg { flex-shrink: 0; }

    #chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 12px 12px;
    }

    .chat-group-label {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 4px 4px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #c5c5c5;
      cursor: pointer;
      transition: background 0.15s;
      gap: 6px;
    }
    .chat-item:hover { background: #2a2a2a; }
    .chat-item:hover .chat-item-del { opacity: 1; }
    .chat-item.active { background: #2a2a2a; color: #fff; }

    .chat-item-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item-del {
      opacity: 0;
      flex-shrink: 0;
      background: transparent;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
      transition: color 0.15s, opacity 0.15s;
    }
    .chat-item-del:hover { color: #f87171; }

    /* ── 사이드바 모니터링 링크 ── */
    #sidebar-monitor-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin: 0 12px 4px;
      border-radius: 8px;
      background: transparent;
      color: #8b8b8b;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    #sidebar-monitor-link:hover {
      background: #2a2a2a;
      color: #10a37f;
    }
    #sidebar-monitor-link svg { flex-shrink: 0; }

    /* ── 사이드바 하단 (유저 영역) ── */
    #sidebar-footer {
      border-top: 1px solid #2a2a2a;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #user-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #10a37f;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    #user-info {
      flex: 1;
      overflow: hidden;
    }
    #user-name {
      font-size: 13px;
      font-weight: 600;
      color: #ececec;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #user-role {
      font-size: 11px;
      color: #666;
    }

    #logout-btn {
      background: transparent;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      display: flex; align-items: center;
      flex-shrink: 0;
    }
    #logout-btn:hover { color: #f87171; background: #2a2a2a; }

    /* ── 메인 영역 ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    #header {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #ececec;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #header span.dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #10a37f;
      display: inline-block;
    }
    #header .header-title { flex: 1; }
    #trace-toggle-btn {
      background: transparent;
      border: 1px solid #3a3a3a;
      color: #888;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: border-color 0.15s, color 0.15s;
    }
    #trace-toggle-btn:hover { border-color: #10a37f; color: #10a37f; }
    #trace-toggle-btn.active { border-color: #10a37f; color: #10a37f; background: #0a2e24; }

    #monitor-link {
      background: transparent;
      border: 1px solid #3a3a3a;
      color: #888;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    #monitor-link:hover { border-color: #6366f1; color: #818cf8; }

    /* ── 메시지 목록 ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .msg-row {
      display: flex;
      padding: 12px 10%;
      gap: 16px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

    .msg-row.user { flex-direction: row-reverse; }
    .msg-row.assistant { background: #2a2a2a; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      flex-shrink: 0;
    }
    .avatar.user { background: #10a37f; color: #fff; }
    .avatar.assistant { background: #444; color: #ececec; font-size: 16px; }

    .bubble-wrap {
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bubble {
      line-height: 1.65;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble-wrap { align-items: flex-end; }
    .msg-row.user .bubble {
      background: #2f6ef7;
      color: #fff;
      padding: 10px 16px;
      border-radius: 16px 16px 4px 16px;
    }
    .msg-row.assistant .bubble { padding: 4px 0; }

    /* 분석 버튼 */
    .msg-analyze-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: 1px solid #3a3a3a;
      color: #666;
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      width: fit-content;
    }
    .msg-analyze-btn:hover { border-color: #10a37f; color: #10a37f; }

    /* 로딩 점 */
    .typing-indicator {
      display: flex; gap: 5px; align-items: center; height: 24px;
    }
    .typing-indicator span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #888;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    /* 빈 화면 안내 */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #888;
      padding-bottom: 80px;
    }
    #empty-state h2 { font-size: 22px; color: #ccc; }
    #empty-state p { font-size: 14px; }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 600px;
    }
    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #3a3a3a;
      background: #2a2a2a;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .chip:hover { border-color: #10a37f; color: #10a37f; }

    /* ── 입력 영역 ── */
    #input-area {
      padding: 16px 10%;
      border-top: 1px solid #2a2a2a;
      background: #212121;
    }

    #input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.15s;
    }
    #input-wrapper:focus-within { border-color: #10a37f; }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ececec;
      font-size: 15px;
      resize: none;
      max-height: 160px;
      line-height: 1.5;
      font-family: inherit;
    }
    #user-input::placeholder { color: #666; }

    #send-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: none;
      background: #10a37f;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:hover { background: #0e9070; }
    #send-btn:disabled { background: #3a3a3a; cursor: not-allowed; }

    #input-hint {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-top: 8px;
    }

    /* ════════════════════════════════
       Decision Trace Panel (우측)
    ════════════════════════════════ */
    #trace-panel {
      width: 340px;
      flex-shrink: 0;
      background: #1a1a1a;
      border-left: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #trace-panel.hidden { display: none; }

    #trace-panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #trace-panel-title {
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
      flex: 1;
    }
    #trace-panel-close {
      background: transparent;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    #trace-panel-close:hover { color: #f87171; }

    #trace-tabs {
      display: flex;
      border-bottom: 1px solid #2a2a2a;
      padding: 0 12px;
    }
    .trace-tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #666;
      font-size: 12px;
      font-weight: 500;
      padding: 10px 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .trace-tab:hover { color: #ccc; }
    .trace-tab.active { color: #10a37f; border-bottom-color: #10a37f; }

    #trace-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 패널 빈 상태 */
    .trace-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #444;
      font-size: 13px;
      text-align: center;
      line-height: 1.8;
    }

    /* ── 섹션 카드 ── */
    .trace-card {
      background: #222;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .trace-card-title {
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── 요약 탭 ── */
    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .summary-label { color: #888; }
    .summary-value { color: #ececec; font-weight: 500; }
    .summary-value.green { color: #10a37f; }
    .summary-value.orange { color: #f59e0b; }
    .summary-value.red { color: #f87171; }

    .risk-flag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .risk-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .risk-tag.critical { background: #3f1010; color: #f87171; border: 1px solid #5a1a1a; }
    .risk-tag.high     { background: #3a2a00; color: #f59e0b; border: 1px solid #5a4000; }
    .risk-tag.medium   { background: #2a2a00; color: #eab308; border: 1px solid #444400; }
    .risk-tag.info     { background: #1a2a3a; color: #60a5fa; border: 1px solid #1e3a5f; }

    /* ── Agent 행 ── */
    .agent-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 0;
      border-bottom: 1px solid #2e2e2e;
    }
    .agent-row:last-child { border-bottom: none; }
    .agent-row-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .agent-dot.selected { background: #10a37f; }
    .agent-dot.rejected { background: #f87171; }
    .agent-name {
      font-size: 12px;
      font-weight: 600;
      color: #ccc;
      flex: 1;
    }
    .agent-role {
      font-size: 10px;
      color: #666;
    }
    .agent-score {
      font-size: 11px;
      color: #888;
    }
    .agent-reason {
      font-size: 11px;
      color: #666;
      padding-left: 13px;
      line-height: 1.4;
    }
    .agent-tools {
      padding-left: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .agent-tool-chip {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: #1a3020;
      color: #10a37f;
      border: 1px solid #204030;
    }

    /* ── Concept 배지 ── */
    .concept-section { display: flex; flex-direction: column; gap: 6px; }
    .concept-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0 2px;
    }
    .concept-section-label.core      { color: #3b82f6; }
    .concept-section-label.supporting{ color: #10a37f; }
    .concept-section-label.reference { color: #6b7280; }

    .concept-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .concept-badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: 500;
    }
    .concept-badge.core {
      background: #1a2a4a;
      color: #93c5fd;
      border: 1px solid #1e3a6e;
    }
    .concept-badge.supporting {
      background: #0a2e24;
      color: #6ee7b7;
      border: 1px solid #0e4030;
    }
    .concept-badge.reference {
      background: #1e1e20;
      color: #9ca3af;
      border: 1px solid #2a2a2e;
    }

    /* ── Tool 실행 결과 ── */
    .tool-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 0;
      border-bottom: 1px solid #2e2e2e;
    }
    .tool-row:last-child { border-bottom: none; }
    .tool-row-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tool-status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tool-status-dot.success { background: #10a37f; }
    .tool-status-dot.error   { background: #f87171; }
    .tool-name {
      font-size: 12px;
      font-weight: 600;
      color: #ccc;
      flex: 1;
    }
    .tool-latency {
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
    }
    .tool-latency.fast { color: #10a37f; }
    .tool-latency.slow { color: #f59e0b; }
    .tool-agent {
      font-size: 10px;
      color: #555;
      padding-left: 13px;
    }

    /* 스크롤바 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     로그인 오버레이
═══════════════════════════════════════ -->
<div id="login-overlay">
  <div id="login-box">
    <div class="login-header">
      <div class="login-logo">🏦</div>
      <h1>AI 금융 상담 챗봇</h1>
      <p>로그인하면 이전 상담 내역을 이어서 볼 수 있습니다.</p>
    </div>

    <hr class="login-divider" />

    <div class="login-field">
      <label for="login-username">사용자 이름</label>
      <input id="login-username" type="text" placeholder="이름을 입력하세요"
             onkeydown="if(event.key==='Enter') doLogin()" />
    </div>

    <div class="login-field">
      <label for="login-apikey">API Key <span style="color:#555;font-weight:400">(선택 · AUTH 비활성 시 생략 가능)</span></label>
      <input id="login-apikey" type="password" placeholder="X-API-Key 값 (없으면 비워두세요)"
             onkeydown="if(event.key==='Enter') doLogin()" />
    </div>

    <div id="login-error"></div>

    <button id="login-btn" onclick="doLogin()">시작하기</button>
  </div>
</div>

<!-- ═══════════════════════════════════════
     앱 본체 (로그인 후)
═══════════════════════════════════════ -->
<div id="app" class="hidden">

  <!-- 사이드바 -->
  <div id="sidebar">
    <div id="sidebar-top">
      <button id="new-chat-btn" onclick="newChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        새 대화 시작
      </button>
    </div>

    <div id="chat-list"></div>

    <a id="sidebar-monitor-link" href="/monitor" target="_blank" title="Leader Agent 모니터링 화면">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      모니터링
    </a>

    <div id="sidebar-footer">
      <div id="user-avatar"></div>
      <div id="user-info">
        <div id="user-name"></div>
        <div id="user-role">금융 상담 이용자</div>
      </div>
      <button id="logout-btn" onclick="doLogout()" title="로그아웃">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 메인 -->
  <div id="main">
    <div id="header">
      <span class="dot"></span>
      <span class="header-title">AI 금융 상담 챗봇</span>
      <a id="monitor-link" href="/monitor" target="_blank" title="Leader Agent 모니터링 화면">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        모니터링
      </a>
      <button id="trace-toggle-btn" onclick="toggleTracePanel()" title="Decision 분석 패널 열기/닫기">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        Decision 분석
      </button>
    </div>

    <div id="messages">
      <div id="empty-state">
        <h2>무엇을 도와드릴까요?</h2>
        <p>금융 상품, 금리, 대출 조건 등을 물어보세요.</p>
        <div class="suggestion-chips">
          <div class="chip" onclick="sendSuggestion(this)">개인 신용 대출 금리가 얼마인가요?</div>
          <div class="chip" onclick="sendSuggestion(this)">대출 상품 종류를 알려주세요</div>
          <div class="chip" onclick="sendSuggestion(this)">대출 신청에 필요한 서류는?</div>
          <div class="chip" onclick="sendSuggestion(this)">우대 금리 조건이 궁금합니다</div>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div id="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="질문을 입력하세요..."
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button id="send-btn" onclick="sendMessage()" title="전송 (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
      <div id="input-hint">Enter로 전송 · Shift+Enter로 줄바꿈</div>
    </div>
  </div>

  <!-- Decision Trace Panel -->
  <div id="trace-panel" class="hidden">
    <div id="trace-panel-header">
      <span id="trace-panel-title">Decision 분석</span>
      <button id="trace-panel-close" onclick="closeTracePanel()" title="닫기">✕</button>
    </div>
    <div id="trace-tabs">
      <button class="trace-tab active" onclick="showTab('summary')">요약</button>
      <button class="trace-tab" onclick="showTab('concepts')">Concept</button>
      <button class="trace-tab" onclick="showTab('agents')">Agent</button>
      <button class="trace-tab" onclick="showTab('tools')">Tool</button>
    </div>
    <div id="trace-body">
      <div class="trace-empty">응답 후 분석 버튼을 눌러<br>Decision 결과를 확인하세요.</div>
    </div>
  </div>

</div><!-- /#app -->

<script>
  const API_URL = '/api/v1/ai/chat';

  // ────────────────────────────────────────────
  // 상태
  // ────────────────────────────────────────────
  let currentUser = null;
  let sessions = [];
  let currentSessionIdx = -1;
  let isLoading = false;
  let activeDecisionV2 = null;
  let activeTab = 'summary';

  // ────────────────────────────────────────────
  // localStorage 키
  // ────────────────────────────────────────────
  function storageKey(username) { return `ai-banking:sessions:${username}`; }
  function authKey() { return 'ai-banking:auth'; }

  function saveSessions() {
    if (!currentUser) return;
    try { localStorage.setItem(storageKey(currentUser.name), JSON.stringify(sessions)); }
    catch(e) {}
  }
  function loadSessions(username) {
    try {
      const raw = localStorage.getItem(storageKey(username));
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }
  function saveAuth(user) {
    try { localStorage.setItem(authKey(), JSON.stringify(user)); } catch(e) {}
  }
  function loadAuth() {
    try { const raw = localStorage.getItem(authKey()); return raw ? JSON.parse(raw) : null; }
    catch(e) { return null; }
  }
  function clearAuth() {
    try { localStorage.removeItem(authKey()); } catch(e) {}
  }

  // ────────────────────────────────────────────
  // 로그인 / 로그아웃
  // ────────────────────────────────────────────
  function doLogin() {
    const nameEl  = document.getElementById('login-username');
    const keyEl   = document.getElementById('login-apikey');
    const errorEl = document.getElementById('login-error');
    const name = nameEl.value.trim();
    if (!name) { errorEl.textContent = '사용자 이름을 입력해 주세요.'; nameEl.focus(); return; }
    errorEl.textContent = '';
    currentUser = { name, apiKey: keyEl.value.trim() };
    saveAuth(currentUser);
    sessions = loadSessions(name);
    currentSessionIdx = sessions.length > 0 ? 0 : -1;
    showApp();
  }

  function doLogout() {
    saveSessions(); clearAuth();
    currentUser = null; sessions = []; currentSessionIdx = -1; activeDecisionV2 = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-overlay').classList.remove('hidden');
    document.getElementById('login-username').value = '';
    document.getElementById('login-apikey').value = '';
    document.getElementById('login-error').textContent = '';
  }

  function showApp() {
    document.getElementById('login-overlay').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    const initials = currentUser.name.slice(0, 1).toUpperCase();
    document.getElementById('user-avatar').textContent = initials;
    document.getElementById('user-name').textContent   = currentUser.name;
    renderSidebar();
    currentSessionIdx >= 0 ? renderMessages() : renderEmptyState();
    document.getElementById('user-input').focus();
  }

  // ────────────────────────────────────────────
  // 세션 관리
  // ────────────────────────────────────────────
  function generateId() { return 'sess-' + Math.random().toString(36).slice(2, 10); }

  function newChat() {
    const sess = { id: generateId(), title: '새 대화', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
    sessions.unshift(sess);
    currentSessionIdx = 0;
    activeDecisionV2 = null;
    saveSessions(); renderSidebar(); renderEmptyState();
    document.getElementById('user-input').focus();
  }

  function switchSession(idx) {
    currentSessionIdx = idx;
    activeDecisionV2 = null;
    renderSidebar(); renderMessages();
    if (!document.getElementById('trace-panel').classList.contains('hidden')) {
      document.getElementById('trace-body').innerHTML =
        '<div class="trace-empty">응답 후 분석 버튼을 눌러<br>Decision 결과를 확인하세요.</div>';
    }
  }

  function deleteSession(idx, event) {
    event.stopPropagation();
    sessions.splice(idx, 1);
    if (currentSessionIdx >= sessions.length) currentSessionIdx = sessions.length - 1;
    saveSessions(); renderSidebar();
    currentSessionIdx >= 0 ? renderMessages() : renderEmptyState();
  }

  // ────────────────────────────────────────────
  // 날짜 그룹
  // ────────────────────────────────────────────
  function dateGroup(ts) {
    const now = new Date(), date = new Date(ts);
    const diffDays = Math.floor((now - date) / 86400000);
    if (diffDays === 0) return '오늘';
    if (diffDays === 1) return '어제';
    if (diffDays < 7)  return '최근 7일';
    if (diffDays < 30) return '이번 달';
    return '이전';
  }

  // ────────────────────────────────────────────
  // 렌더링
  // ────────────────────────────────────────────
  function renderSidebar() {
    const list = document.getElementById('chat-list');
    if (sessions.length === 0) {
      list.innerHTML = `<div style="padding:12px 4px;font-size:12px;color:#555;text-align:center">
        대화 내역이 없습니다.<br>새 대화를 시작해 보세요.</div>`;
      return;
    }
    const groups = {}; const order = ['오늘','어제','최근 7일','이번 달','이전'];
    sessions.forEach((s, i) => {
      const g = dateGroup(s.updatedAt || s.createdAt || Date.now());
      if (!groups[g]) groups[g] = [];
      groups[g].push({ s, i });
    });
    let html = '';
    order.forEach(g => {
      if (!groups[g]) return;
      html += `<div class="chat-group-label">${g}</div>`;
      groups[g].forEach(({ s, i }) => {
        html += `<div class="chat-item ${i === currentSessionIdx ? 'active' : ''}" onclick="switchSession(${i})">
          <span class="chat-item-title">${escapeHtml(s.title)}</span>
          <button class="chat-item-del" onclick="deleteSession(${i}, event)" title="삭제">✕</button>
        </div>`;
      });
    });
    list.innerHTML = html;
  }

  function renderMessages() {
    const container = document.getElementById('messages');
    const session = sessions[currentSessionIdx];
    if (!session || session.messages.length === 0) { renderEmptyState(); return; }
    container.innerHTML = session.messages.map((m, idx) => buildMsgHTML(m.role, m.content, m.decision_v2, idx)).join('');
    scrollToBottom();
  }

  function renderEmptyState() {
    document.getElementById('messages').innerHTML = `
      <div id="empty-state">
        <h2>무엇을 도와드릴까요?</h2>
        <p>금융 상품, 금리, 대출 조건 등을 물어보세요.</p>
        <div class="suggestion-chips">
          <div class="chip" onclick="sendSuggestion(this)">개인 신용 대출 금리가 얼마인가요?</div>
          <div class="chip" onclick="sendSuggestion(this)">대출 상품 종류를 알려주세요</div>
          <div class="chip" onclick="sendSuggestion(this)">대출 신청에 필요한 서류는?</div>
          <div class="chip" onclick="sendSuggestion(this)">우대 금리 조건이 궁금합니다</div>
        </div>
      </div>`;
  }

  function buildMsgHTML(role, content, decision_v2, idx) {
    const initials = (currentUser && role === 'user') ? currentUser.name.slice(0, 1).toUpperCase() : '🏦';
    const avatarHtml = role === 'user'
      ? `<div class="avatar user">${initials}</div>`
      : `<div class="avatar assistant">🏦</div>`;

    let analyzeBtn = '';
    if (role === 'assistant' && decision_v2) {
      analyzeBtn = `<button class="msg-analyze-btn" onclick="openTracePanel(${idx})" title="Decision 분석 보기">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        Decision 분석
      </button>`;
    }

    return `<div class="msg-row ${role}">
      ${avatarHtml}
      <div class="bubble-wrap">
        <div class="bubble">${escapeHtml(content)}</div>
        ${analyzeBtn}
      </div>
    </div>`;
  }

  // ────────────────────────────────────────────
  // 메시지 전송
  // ────────────────────────────────────────────
  function addTypingIndicator() {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg-row assistant'; div.id = 'typing-row';
    div.innerHTML = `<div class="avatar assistant">🏦</div>
      <div class="bubble-wrap"><div class="bubble">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div></div>`;
    container.appendChild(div); scrollToBottom();
  }
  function removeTypingIndicator() {
    const el = document.getElementById('typing-row'); if (el) el.remove();
  }

  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('user-input');
    const text  = input.value.trim();
    if (!text) return;

    if (currentSessionIdx === -1 || sessions.length === 0) newChat();
    const session = sessions[currentSessionIdx];
    if (session.messages.length === 0) {
      session.title = text.slice(0, 28) + (text.length > 28 ? '…' : '');
    }

    session.messages.push({ role: 'user', content: text });
    session.updatedAt = Date.now();
    input.value = ''; input.style.height = 'auto';
    saveSessions(); renderSidebar(); renderMessages();

    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    addTypingIndicator();

    try {
      const headers = { 'Content-Type': 'application/json' };
      if (currentUser.apiKey) headers['X-API-Key'] = currentUser.apiKey;

      const res = await fetch(API_URL, {
        method: 'POST', headers,
        body: JSON.stringify({ message: text, session_id: session.id, user_id: currentUser.name }),
      });

      if (res.status === 401) throw new Error('인증 오류: API Key를 확인하세요.');
      if (res.status === 403) throw new Error('권한 없음: 이 기능은 ANALYST 이상 필요합니다.');
      if (!res.ok) { const err = await res.text(); throw new Error(`서버 오류 (${res.status}): ${err}`); }

      const data = await res.json();
      session.messages.push({
        role: 'assistant',
        content: data.answer,
        decision_v2: data.decision_v2 || null,
      });

      // 최신 Decision V2를 자동으로 패널에 반영 (패널이 열려있는 경우)
      if (data.decision_v2) {
        activeDecisionV2 = data.decision_v2;
        if (!document.getElementById('trace-panel').classList.contains('hidden')) {
          renderTraceTab(activeTab);
        }
      }

    } catch (e) {
      session.messages.push({ role: 'assistant', content: `⚠️ 오류가 발생했습니다.\n${e.message}`, decision_v2: null });
    } finally {
      isLoading = false;
      document.getElementById('send-btn').disabled = false;
      removeTypingIndicator();
      session.updatedAt = Date.now();
      saveSessions(); renderSidebar(); renderMessages();
    }
  }

  // ────────────────────────────────────────────
  // Decision Trace Panel
  // ────────────────────────────────────────────
  function toggleTracePanel() {
    const panel = document.getElementById('trace-panel');
    const btn   = document.getElementById('trace-toggle-btn');
    if (panel.classList.contains('hidden')) {
      panel.classList.remove('hidden');
      btn.classList.add('active');
      if (activeDecisionV2) renderTraceTab(activeTab);
    } else {
      panel.classList.add('hidden');
      btn.classList.remove('active');
    }
  }

  function closeTracePanel() {
    document.getElementById('trace-panel').classList.add('hidden');
    document.getElementById('trace-toggle-btn').classList.remove('active');
  }

  function openTracePanel(msgIdx) {
    const session = sessions[currentSessionIdx];
    if (!session) return;
    const msg = session.messages[msgIdx];
    if (!msg || !msg.decision_v2) return;
    activeDecisionV2 = msg.decision_v2;

    const panel = document.getElementById('trace-panel');
    const btn   = document.getElementById('trace-toggle-btn');
    panel.classList.remove('hidden');
    btn.classList.add('active');
    renderTraceTab(activeTab);
  }

  function showTab(name) {
    activeTab = name;
    document.querySelectorAll('.trace-tab').forEach((t, i) => {
      const tabs = ['summary', 'concepts', 'agents', 'tools'];
      t.classList.toggle('active', tabs[i] === name);
    });
    renderTraceTab(name);
  }

  function renderTraceTab(name) {
    const body = document.getElementById('trace-body');
    if (!activeDecisionV2) {
      body.innerHTML = '<div class="trace-empty">분석 데이터가 없습니다.</div>';
      return;
    }
    const dv = activeDecisionV2;
    switch (name) {
      case 'summary':  body.innerHTML = renderSummaryTab(dv);  break;
      case 'concepts': body.innerHTML = renderConceptsTab(dv); break;
      case 'agents':   body.innerHTML = renderAgentsTab(dv);   break;
      case 'tools':    body.innerHTML = renderToolsTab(dv);    break;
    }
  }

  // ── 요약 탭 ─────────────────────────────────
  function renderSummaryTab(dv) {
    const intent    = dv.intent?.name || '-';
    const selCount  = (dv.selected_agents || []).length;
    const rejCount  = (dv.rejected_agents || []).length;
    const riskFlags = dv.risk_flags || [];
    const selNames  = (dv.selected_agents || []).map(a => shortAgentName(a.agent_name)).join(', ') || '-';

    const flagHtml = riskFlags.length
      ? riskFlags.map(f => `<span class="risk-tag ${riskLevel(f)}">${f}</span>`).join('')
      : '<span style="color:#555;font-size:11px">없음</span>';

    const passedCls  = dv.requires_disclaimer ? 'orange' : 'green';
    const passedText = dv.requires_disclaimer ? '면책문구 삽입' : '통과';

    const memDecision = renderMemoryDecision(dv);

    return `
      <div class="trace-card">
        <div class="trace-card-title">처리 요약</div>
        <div class="summary-row"><span class="summary-label">의도</span><span class="summary-value">${escapeHtml(intent)}</span></div>
        <div class="summary-row"><span class="summary-label">선택 Agent</span><span class="summary-value green">${selCount}개</span></div>
        <div class="summary-row"><span class="summary-label">미선택 Agent</span><span class="summary-value" style="color:#888">${rejCount}개</span></div>
        <div class="summary-row"><span class="summary-label">실행 Agent</span><span class="summary-value" style="font-size:11px">${escapeHtml(selNames)}</span></div>
        <div class="summary-row"><span class="summary-label">검증 결과</span><span class="summary-value ${passedCls}">${passedText}</span></div>
      </div>
      <div class="trace-card">
        <div class="trace-card-title">위험 플래그</div>
        <div class="risk-flag-list">${flagHtml}</div>
      </div>
      ${memDecision}`;
  }

  function renderMemoryDecision(dv) {
    return '';
  }

  // ── Concept 탭 ──────────────────────────────
  function renderConceptsTab(dv) {
    const concepts = dv.concepts || {};
    const core      = concepts.core      || [];
    const supporting= concepts.supporting|| [];
    const reference = concepts.reference || [];

    function badgeList(items, cls) {
      if (!items.length) return '<span style="color:#444;font-size:11px">없음</span>';
      return `<div class="concept-badges">` +
        items.map(c => `<span class="concept-badge ${cls}" title="${escapeHtml(c.reason || '')}">${escapeHtml(shortConceptName(c.name))}</span>`).join('') +
        `</div>`;
    }

    return `
      <div class="trace-card">
        <div class="trace-card-title">Concept 분류</div>
        <div class="concept-section">
          <div class="concept-section-label core">Core (핵심)</div>
          ${badgeList(core, 'core')}
        </div>
        <div class="concept-section">
          <div class="concept-section-label supporting">Supporting (보조)</div>
          ${badgeList(supporting, 'supporting')}
        </div>
        <div class="concept-section">
          <div class="concept-section-label reference">Reference (참조)</div>
          ${badgeList(reference, 'reference')}
        </div>
      </div>
      ${renderSlotRankings(dv)}`;
  }

  function renderSlotRankings(dv) {
    const slots = dv.slot_rankings || [];
    if (!slots.length) return '';
    const rows = slots.map(s => {
      const filled  = s.slot_filled ? '✓' : '—';
      const filledCls = s.slot_filled ? 'green' : '';
      const best = s.best_evidence
        ? `<span style="font-size:10px;color:#666">${escapeHtml(s.best_evidence.api_id)} · ${(s.best_evidence.confidence_score * 100).toFixed(0)}%</span>`
        : '';
      return `<div class="summary-row">
        <span class="summary-label">${escapeHtml(s.label_ko)}</span>
        <span class="summary-value ${filledCls}">${filled} ${best}</span>
      </div>`;
    }).join('');
    return `<div class="trace-card"><div class="trace-card-title">Answer Slot Ranking</div>${rows}</div>`;
  }

  // ── Agent 탭 ────────────────────────────────
  function renderAgentsTab(dv) {
    const selected = (dv.selected_agents || []).map(a => renderAgentRow(a, true)).join('');
    const rejected = (dv.rejected_agents || []).map(a => renderAgentRow(a, false)).join('');
    return `
      <div class="trace-card">
        <div class="trace-card-title">선택된 Agent (${(dv.selected_agents || []).length})</div>
        ${selected || '<span style="color:#444;font-size:11px">없음</span>'}
      </div>
      <div class="trace-card">
        <div class="trace-card-title">미선택 Agent (${(dv.rejected_agents || []).length})</div>
        ${rejected || '<span style="color:#444;font-size:11px">없음</span>'}
      </div>`;
  }

  function renderAgentRow(agent, isSelected) {
    const name    = shortAgentName(agent.agent_name);
    const dotCls  = isSelected ? 'selected' : 'rejected';
    const role    = isSelected ? (agent.role || '') : '';
    const score   = typeof agent.score === 'number' ? `${(agent.score * 100).toFixed(0)}%` : '';
    const reason  = agent.reason || agent.rejection_reason || '';
    const tools   = isSelected && agent.tools && agent.tools.length
      ? `<div class="agent-tools">${agent.tools.map(t => `<span class="agent-tool-chip">${escapeHtml(shortToolName(t))}</span>`).join('')}</div>`
      : '';
    const mode    = isSelected && agent.execution_mode && agent.execution_mode !== 'normal'
      ? `<span class="risk-tag info" style="font-size:9px">${escapeHtml(agent.execution_mode)}</span>`
      : '';

    return `<div class="agent-row">
      <div class="agent-row-top">
        <div class="agent-dot ${dotCls}"></div>
        <span class="agent-name">${escapeHtml(name)}</span>
        ${role ? `<span class="agent-role">${escapeHtml(role)}</span>` : ''}
        ${mode}
        ${score ? `<span class="agent-score">${score}</span>` : ''}
      </div>
      ${reason ? `<div class="agent-reason">${escapeHtml(reason)}</div>` : ''}
      ${tools}
    </div>`;
  }

  // ── Tool 탭 ─────────────────────────────────
  function renderToolsTab(dv) {
    const selected = dv.selected_agents || [];
    const allTools = [];
    selected.forEach(a => {
      (a.tools || []).forEach(t => {
        allTools.push({ tool: t, agent: a.agent_name, mode: a.execution_mode });
      });
    });

    if (!allTools.length) {
      return `<div class="trace-card"><div class="trace-card-title">Tool 실행 결과</div>
        <span style="color:#444;font-size:11px">Tool 실행 정보 없음</span></div>`;
    }

    const rows = allTools.map(({ tool, agent, mode }) => {
      const name = shortToolName(tool);
      return `<div class="tool-row">
        <div class="tool-row-top">
          <div class="tool-status-dot success"></div>
          <span class="tool-name">${escapeHtml(name)}</span>
          ${mode === 'lightweight' ? '<span class="risk-tag info" style="font-size:9px">lightweight</span>' : ''}
        </div>
        <div class="tool-agent">${escapeHtml(shortAgentName(agent))}</div>
      </div>`;
    }).join('');

    return `<div class="trace-card"><div class="trace-card-title">Tool 실행 계획</div>${rows}</div>
      ${renderSlotRankings(dv)}`;
  }

  // ────────────────────────────────────────────
  // 이름 줄임 헬퍼
  // ────────────────────────────────────────────
  function shortAgentName(name) {
    return (name || '').replace(/_AGENT$/, '').replace('LEADER', 'LEADER');
  }
  function shortConceptName(name) {
    return (name || '').replace(/^CONCEPT_/, '').replace(/_/g, ' ');
  }
  function shortToolName(name) {
    return (name || '').replace(/^MOCK_/, '').replace(/_/g, ' ');
  }

  // risk_level 추론 (check_id → level)
  const RISK_LEVEL_MAP = {
    V008: 'critical', V009: 'critical',
    V007: 'high',     V010: 'high',
    V001: 'medium', V004: 'medium', V006: 'medium',
    V002: 'info',   V003: 'info',   V005: 'info',
  };
  function riskLevel(checkId) {
    return RISK_LEVEL_MAP[checkId] || 'info';
  }

  // ────────────────────────────────────────────
  // 유틸
  // ────────────────────────────────────────────
  function sendSuggestion(el) {
    document.getElementById('user-input').value = el.textContent.trim();
    sendMessage();
  }
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }
  function scrollToBottom() {
    const c = document.getElementById('messages');
    c.scrollTop = c.scrollHeight;
  }
  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ────────────────────────────────────────────
  // 초기 실행
  // ────────────────────────────────────────────
  (function init() {
    const saved = loadAuth();
    if (saved && saved.name) {
      currentUser = saved;
      sessions = loadSessions(saved.name);
      currentSessionIdx = sessions.length > 0 ? 0 : -1;
      showApp();
    } else {
      document.getElementById('login-overlay').classList.remove('hidden');
      document.getElementById('login-username').focus();
    }
  })();
</script>
</body>
</html>
